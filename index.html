<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dot Safari — Connect &amp; Color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <h1>Dot Safari <span>connect the dots, then color!</span></h1>
    <nav id="levelTrack" aria-label="Animal levels"></nav>
  </header>

  <main id="stage">
    <div id="paper">
      <canvas id="colorCanvas" width="600" height="600"></canvas>
      <canvas id="dotsCanvas" width="600" height="600"></canvas>
      <div id="burst" aria-hidden="true"></div>
    </div>

    <div id="messageBanner" class="hidden"></div>
  </main>

  <section id="toolTray" class="hidden" aria-label="Coloring tools">
    <div id="palette" role="listbox" aria-label="Pick a color"></div>

    <div id="trayRight">
      <div id="brushSizes" aria-label="Pencil size">
        <button class="brushBtn" data-size="7" aria-label="Small pencil"><span class="dot small"></span></button>
        <button class="brushBtn selected" data-size="14" aria-label="Medium pencil"><span class="dot medium"></span></button>
        <button class="brushBtn" data-size="24" aria-label="Large pencil"><span class="dot large"></span></button>
      </div>
      <div id="trayActions">
        <button id="eraserBtn" title="Eraser">🧽 Eraser</button>
        <button id="clearColorBtn" title="Clear all coloring">🗑️ Clear</button>
      </div>
    </div>
  </section>

  <footer id="controls">
    <button id="prevLevelBtn" class="navBtn">⬅ Back</button>
    <button id="redoDotsBtn" class="navBtn">🔁 Redo Dots</button>
    <button id="nextLevelBtn" class="navBtn primary hidden">Next Animal ➡</button>
  </footer>

</div>

<script src="animals.js"></script>
<script src="script.js"></script>
</body>
</html>
